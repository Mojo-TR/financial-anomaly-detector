version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: anomaly_detector
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    platform: linux/amd64
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/anomaly_detector
    depends_on:
      - db

volumes:
  pgdata:
